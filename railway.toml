# Railway deploy settings, kept in the repo so a redeploy can't lose them.
[deploy]
# A deploy only goes live once /health answers 200, and /health answers 503
# until the boot preflight has passed. So a build with a bad key or a broken
# turn-taking chain never replaces a good one.
healthcheckPath = "/health"
# Boot loads pipecat + two ONNX models + the preflight; give it room.
healthcheckTimeout = 300
# Sleep when idle (Railway "Serverless"): ~$0 between calls instead of ~$2/mo
# holding 230 MB. The Cloudflare Worker wakes it with GET /health and waits for
# preflight_ok before every /dialout, and re-arms a row if it fails to wake.
sleepApplication = true
